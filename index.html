    <meta name="theme-color" content="#f8fbf9" />

    <!-- Resolves the theme before first paint so there is no flash of the
         wrong palette: saved choice first, then the OS setting. Must stay
         after the theme-color meta it updates. ThemeToggle.jsx does the same
         at runtime. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#0f1110" : "#f8fbf9");
        } catch (e) {}
      })();
    </script>
